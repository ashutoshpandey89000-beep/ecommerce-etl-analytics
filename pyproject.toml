[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-etl-analytics"
version = "1.0.0"
description = "Containerized e-commerce ETL and SQL analytics portfolio project"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
